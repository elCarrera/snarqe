
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Snarqe</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/arrows.css">

    <script src="libs/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="libs/aframe-ar.js"></script>
    <script src="js/snake_engine.js"></script>
    <script src="js/snake_voxel.js"></script>
  </head>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs>
      <a-marker-camera preset="custom" type="pattern" url="patterns/pattern-pixel_apple.patt">
        <a-plane
          position="0 0 0"
          rotation="-90 0 0"
          width="1"
          height="1"
        ></a-plane>
        <a-entity snake-voxel></a-entity>
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6"></a-entity>
      </a-marker-camera>

      <a-entity camera></a-entity>
    </a-scene>
    
    
    <div id="bottom-div">
      <table>
          <tr>
              <td></td>
              <td><div class="arrow" id="up">↑</div></td>
              <td></td>
          </tr>
          <tr>
              <td><div class="arrow" id="left">←</div></td>
              <td></td>
              <td><div class="arrow" id="right">→</div></td>
          </tr>
          <tr>
              <td></td>
              <td><div class="arrow" id="down">↓</div></td>
              <td></td>
          </tr>
      </table>
  </div>

  
  <script>

      function isSmartphone() {
          const userAgent = navigator.userAgent.toLowerCase();
          return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
      }

      if (isSmartphone()) {
          let arrowDiv = document.querySelector('#bottom-div');
          arrowDiv.style.display;


          let arrows = document.querySelectorAll('.arrow');

          arrows.forEach(arrow => {
              arrow.ontouchstart = function() {
                  navigator.vibrate(50);
                  snake.direction(this.id);
              };
          });

      } else {
          let arrowDiv = document.querySelector('#bottom-div');

          // lo hacemos visible y clickable para pruebas
          arrowDiv.style.display ;

          let arrows = document.querySelectorAll('.arrow');
          
          arrows.forEach(arrow => {
              arrow.onclick = function() {
                  snake.direction(this.id);
              };
          });

      }
      
      
  </script>

  </body>
</html>
